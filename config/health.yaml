# Health Index tuning for analytics/health.py. Owner: P3 (Agent B).
# FINAL_PRD section 8.8 gives weights, bands and the cap value but NOT the sub-score mapping.
# Every value below is [Assumed] unless noted; all are configurable.
weights:                      # [Assumed] PRD 8.8 weights; renormalised over available sub-scores
  thermal: 30
  ageing: 25
  loading: 15
  electrical: 15
  integrity: 10
  fault_stress: 5

bands: {green_min: 80, yellow_min: 60}      # [Assumed] PRD 8.8: Green >= 80, Yellow 60-79, Red < 60

weakest_link:                 # [Assumed]
  cap_score: 40               # PRD 8.8: a critical asset alarm caps HI at 40
  cap_window_h: 24            # "in effect" = critical asset alert raised within this many hours

curve:                        # [Assumed] shared piecewise-linear shape: ok -> warning -> critical -> zero
  ok_fraction: 0.8            # score 100 at or below ok_fraction * warning level
  score_at_warning: 70
  score_at_critical: 30
  zero_span: 1.0              # score reaches 0 at critical + zero_span * (critical - warning)

windows_h:                    # [Assumed] smoothing of fast signals before scoring
  ageing: 24                  # rolling mean of aging_rate
  loading: 4                  # rolling mean of load_pu

ageing_rate:                  # [Assumed] multiples of the reference ageing rate (1.0 = hot-spot 98 C)
  ok: 1.0
  warning: 2.0
  critical: 8.0

oil_level:                    # [Assumed] warning level comes from thresholds oil_level_pct.low
  ok_pct: 95
  critical_pct: 70

voltage:                      # [Assumed] critical point = critical_multiple * the configured limit
  critical_multiple: 2.0

unbalance:
  min_load_pu: 0.05           # [Assumed] ignore unbalance below this load (ratio is noise at tiny currents)

alert_scores:                 # [Assumed] sub-score ceiling while a leak/theft or stress alert is in effect
  warning: 60
  critical: 30

through_fault:
  per_event_penalty: 15       # [Assumed] points lost per through-fault alert since start of data (no reset modelled)
