# Pattern families (exact names or glob). Alarm flags -> alarm_*, display only.
# Ground truth -> gt_*, evaluation only, never reaches detectors.
alarm: [oti_a, oti_t, mog_a, "*_alarm", "*_trip", buchholz, prv]
ground_truth: [fault, label, fault_type, fault_label, class, anomaly, status_label, is_fault]
