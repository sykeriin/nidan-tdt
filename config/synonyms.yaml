# Header synonyms for auto-mapping (DATA_INGESTION_SPEC.md §2.4). Extend on the day.
# Headers are normalised first: lowercase, units in ()/[] stripped, separators -> "_".
# "ib"/"vb" are deliberately absent: resolved by phase-scheme context in ingest/map.py.

IR: [ir, i_r, ia, i_a, il1, i1, i_l1, l1_current, current_l1, current_r, r_current, phase_r_current, curr_r, amp_r, r_phase_amps, r_phase_current, ir_a, current_ir]
IY: [iy, i_y, il2, i2, i_l2, l2_current, current_l2, current_y, y_current, phase_y_current, curr_y, amp_y, y_phase_amps, y_phase_current]
IB: [ic, i_c, il3, i3, i_l3, l3_current, current_l3, current_b, b_current, phase_b_current, curr_b, amp_b, b_phase_amps, b_phase_current]
IN: [in, i_n, inut, neutral, neutral_current, i0, current_n]
VR: [vr, v_r, va, v_a, vl1, v1, v_l1, vrn, van, voltage_r, l1_voltage, voltage_l1, r_voltage, r_phase_voltage, vr_n]
VY: [vy, v_y, vl2, v2, v_l2, vyn, voltage_y, l2_voltage, voltage_l2, y_voltage, y_phase_voltage]
VB: [vc, v_c, vl3, v3, v_l3, vbn, vcn, voltage_b, l3_voltage, voltage_l3, b_voltage, b_phase_voltage]
VRY: [vry, v_ry, vab, v_ab, vl12, v12, v_l1_l2, l1_l2_voltage, voltage_ry, line_voltage_ry]
VYB: [vyb, v_yb, vbc, v_bc, vl23, v23, v_l2_l3, l2_l3_voltage, voltage_yb, line_voltage_yb]
